<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Monogram Mark (Modern Geometric M) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 22 60 L 22 24 L 40 46 L 58 24 L 58 60" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="54" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- MODERNO -->
  <text x="110" y="56" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', 'Cinzel', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="4" fill="#0F172A">
    MODERNO
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="112" y="76" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.5" fill="#C59B27">
    CONTEMPORARY ITALIAN LIVING
  </text>
</svg>
